<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OmniCore AI - Ultra-fast, modern, and highly optimized AI chat assistant.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OmniCore AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OmniCore AI</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      height: 100%;
    }

    body {
      background-color: #08090C;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .loader-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 24px;
      z-index: 9999;
      pointer-events: none;
      background: #08090C;
      transition: opacity 180ms ease;
    }

    .brand-logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #00FFCC 0%, #8A2BE2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      animation: pulse 2s infinite ease-in-out;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(0, 255, 204, 0.1);
      border-radius: 50%;
      border-top-color: #00FFCC;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(0, 255, 204, 0.4)); }
    }
  </style>
</head>
<body>
  <div class="loader-container" id="loading-indicator">
    <h1 class="brand-logo">OMNICORE AI</h1>
    <div class="spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading-indicator');
      if (!loader) return;
      loader.style.opacity = '0';
      window.setTimeout(function () {
        loader.remove();
      }, 220);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
